# Production Profile Settings for Cloud Hosts (Render, Railway, Fly.io)

server.port=${PORT:8080}

# Managed Cloud Database Connection (Supports JDBC URL or decomposed host/user/pass)
spring.datasource.url=${DB_URL:${JDBC_DATABASE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:college_erp}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:root}}

# JPA Hibernate Production Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Enable Data Initializer for First Launch Seeding
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.college.erp=INFO
