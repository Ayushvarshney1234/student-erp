# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=College ERP Management System

# Database Configuration (Defaults to MySQL, configurable via ENV)
# For MySQL: set DB_DRIVER=com.mysql.cj.jdbc.Driver, DB_URL=jdbc:mysql://localhost:3306/college_erp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true, DB_USERNAME=root, DB_PASSWORD=root
# For instant zero-setup local run: H2 is supported as fallback profile or direct driver setting.

spring.datasource.url=${DB_URL:jdbc:h2:mem:college_erp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 Console (Enabled for easy debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# SQL Initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Jackson JSON Settings
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-naming-strategy=SNAKE_CASE

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.college.erp=DEBUG
