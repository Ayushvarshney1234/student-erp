services:
  - type: web
    name: college-erp-system
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DB_URL
        fromDatabase:
          name: college-erp-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: college-erp-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: college-erp-db
          property: password

databases:
  - name: college-erp-db
    databaseName: college_erp
    user: admin
    plan: free
